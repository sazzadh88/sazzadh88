<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.idx{font-size:13px;fill:#4a6352}
.code{font-size:13px;font-weight:700;fill:#00ff41;letter-spacing:1px;animation:classified-lit .9s ease-out backwards}
.desc{font-size:14px;fill:#d7ffe0}
.sep{fill:#1f7a3a}
.cl{font-size:13px;fill:#4a6352}
.chip{font-size:13px;fill:#d7ffe0}
.mut{font-size:13px;fill:#7d9a85}
.lead{stroke:#1f7a3a;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:0 7;opacity:.8}
.bar{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0);animation:classified-wipe .5s cubic-bezier(.6,0,.4,1) backwards}
.edge{opacity:0;animation:classified-edge .5s cubic-bezier(.6,0,.4,1) backwards}
.k{animation:classified-deny 1s ease-out both}
.b0,.e0{animation-delay:0.6s}.c0{animation-delay:0.65s}.k0{animation-delay:1s}.b1,.e1{animation-delay:0.96s}.c1{animation-delay:1.01s}.k1{animation-delay:1.36s}.b2,.e2{animation-delay:1.32s}.c2{animation-delay:1.37s}.k2{animation-delay:1.72s}.b3,.e3{animation-delay:1.68s}.c3{animation-delay:1.73s}.k3{animation-delay:2.08s}.b4,.e4{animation-delay:2.04s}.c4{animation-delay:2.09s}.k4{animation-delay:2.44s}.b5,.e5{animation-delay:2.4s}.c5{animation-delay:2.45s}.k5{animation-delay:2.8s}.b6,.e6{animation-delay:2.76s}.c6{animation-delay:2.81s}.k6{animation-delay:3.16s}
@keyframes classified-wipe{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes classified-edge{0%{transform:translateX(0);opacity:0}6%{opacity:1}90%{opacity:1}100%{transform:translateX(668px);opacity:0}}
@keyframes classified-deny{0%,100%{stroke:#24492e}10%,45%{stroke:#ff3b3b}}
@keyframes classified-lit{from{fill:#d7ffe0}to{fill:#00ff41}}
.stamp{transform-box:fill-box;transform-origin:50% 50%;animation:classified-stamp .32s cubic-bezier(.2,1.5,.45,1) 3.45s backwards}
@keyframes classified-stamp{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.ring{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:classified-ring .7s ease-out 3.7s backwards}
@keyframes classified-ring{0%{opacity:0;transform:scale(1)}12%{opacity:.55}100%{opacity:0;transform:scale(1.14)}}
.dot{animation:classified-blink 1.4s steps(1,end) 0s infinite}
@keyframes classified-blink{0%,55%{opacity:1}56%,100%{opacity:.22}}
.strip{animation:classified-fade .6s ease-out 3.2s backwards}
.head{animation:classified-fade .5s ease-out 0.1s backwards}
@keyframes classified-fade{from{opacity:0}to{opacity:1}}
.flow{animation:classified-flow 1.2s linear 0s infinite}
@keyframes classified-flow{to{stroke-dashoffset:-6}}
.sweep{transform:translateY(-140px);animation:classified-sweep 8s linear 1s infinite}
@keyframes classified-sweep{from{transform:translateY(-140px)}to{transform:translateY(440px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
