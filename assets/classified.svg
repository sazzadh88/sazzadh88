<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Classified dossier: 186 private client repositories by sector - agritech, commerce, health, logistics, edtech, fintech, AI and media. Client names redacted.">
<title>Classified: 186 private repositories, client work by sector</title>
<defs>
<linearGradient id="classified-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e0a"/><stop offset="1" stop-color="#0d1410"/></linearGradient>
<linearGradient id="classified-sweep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset=".85" stop-color="#00ff41" stop-opacity=".05"/><stop offset="1" stop-color="#00ff41" stop-opacity=".10"/></linearGradient>
<linearGradient id="classified-topred" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b3b" stop-opacity=".09"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></linearGradient>
<linearGradient id="classified-trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset="1" stop-color="#00ff41" stop-opacity=".2"/></linearGradient>
<pattern id="classified-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00ff41" opacity=".035"/></pattern>
