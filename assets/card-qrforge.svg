<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 210" width="430" height="210" role="img" aria-label="QRForge: Self-hosted QR platform. Dynamic short links, hosted pages, branded designs, scan analytics and a REST API. (Next.js; 19 code types, analytics, REST API)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title>QRForge - Self-hosted QR platform.</title>
<defs>
<linearGradient id="card-qrforge-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e0a"/><stop offset="1" stop-color="#0d1410"/></linearGradient>
<radialGradient id="card-qrforge-halo" cx="380" cy="171" r="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00ff41" stop-opacity=".1"/><stop offset="1" stop-color="#00ff41" stop-opacity="0"/></radialGradient>
<linearGradient id="card-qrforge-rule" x1="22" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1c3a23"/><stop offset=".7" stop-color="#14261a"/><stop offset="1" stop-color="#14261a" stop-opacity="0"/></linearGradient>
<pattern id="card-qrforge-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00ff41" opacity=".035"/></pattern>
<filter id="card-qrforge-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="card-qrforge-soft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
