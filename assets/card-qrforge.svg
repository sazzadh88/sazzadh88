<style>
.card-qrforge-in{animation:card-qrforge-in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes card-qrforge-in{from{opacity:0;transform:translateY(5px)}}
.card-qrforge-ti{animation:card-qrforge-ti .55s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes card-qrforge-ti{from{opacity:0;transform:translateX(-8px)}}
.card-qrforge-br{stroke-dasharray:30;animation:card-qrforge-br .7s ease-out both}
