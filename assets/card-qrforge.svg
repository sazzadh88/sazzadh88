.card-qrforge-fd{animation:card-qrforge-fd 1.2s ease-out .8s both}
@keyframes card-qrforge-fd{from{opacity:0}}
.card-qrforge-pulse{animation:card-qrforge-pulse 5.4s ease-in-out -5.7s infinite}
@keyframes card-qrforge-pulse{0%,100%{opacity:.1}50%{opacity:.36}}
.card-qrforge-pulse2{animation:card-qrforge-pulse2 5.4s ease-in-out -5.7s infinite}
@keyframes card-qrforge-pulse2{0%,100%{opacity:.02}50%{opacity:.08}}
.card-qrforge-beam{opacity:0;animation:card-qrforge-on 1.2s ease-out 1.8s forwards}
@keyframes card-qrforge-on{to{opacity:1}}
.card-qrforge-bm{animation:card-qrforge-bm 11s linear infinite}
@keyframes card-qrforge-bm{from{stroke-dashoffset:0}to{stroke-dashoffset:-1255.4}}
.card-qrforge-cur{animation:card-qrforge-cur 1.1s steps(1,end) infinite}
@keyframes card-qrforge-cur{50%{fill-opacity:0}}
.card-qrforge-m{animation:card-qrforge-fk 3.4s steps(1,end) infinite}
.card-qrforge-m2{animation-duration:2.6s;animation-delay:-1.1s}.card-qrforge-m3{animation-duration:4.3s;animation-delay:-2.2s}.card-qrforge-m4{animation-duration:5.1s;animation-delay:-.6s}
@keyframes card-qrforge-fk{0%{opacity:1}38%{opacity:.15}55%{opacity:1}80%{opacity:.4}90%{opacity:1}}
.card-qrforge-sc{animation:card-qrforge-sc 5.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes card-qrforge-sc{0%{transform:translateY(0);opacity:0}8%{opacity:.85}42%{transform:translateY(50px);opacity:.85}50%,100%{transform:translateY(50px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
