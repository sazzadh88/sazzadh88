.card-qrforge-hl{transform-origin:22px 150px;animation:card-qrforge-hl .7s ease-out 1.1s both}
@keyframes card-qrforge-hl{from{transform:scaleX(0)}}
.card-qrforge-gl{transform-origin:380px 171px;animation:card-qrforge-gl .8s cubic-bezier(.2,.8,.2,1) .9s both}
