<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 210" width="430" height="210" role="img" aria-label="Motion Graphics Generator: Templates in, MP4 out. Live browser studio, server-side rendering and AI template generation from a prompt. (TypeScript; Puppeteer, FFmpeg, MP4 / WebM)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title>Motion Graphics Generator - Templates in, MP4 out.</title>
<defs>
<linearGradient id="card-motion-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e0a"/><stop offset="1" stop-color="#0d1410"/></linearGradient>
<radialGradient id="card-motion-halo" cx="380" cy="171" r="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00ff41" stop-opacity=".1"/><stop offset="1" stop-color="#00ff41" stop-opacity="0"/></radialGradient>
<linearGradient id="card-motion-rule" x1="22" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1c3a23"/><stop offset=".7" stop-color="#14261a"/><stop offset="1" stop-color="#14261a" stop-opacity="0"/></linearGradient>
<pattern id="card-motion-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00ff41" opacity=".035"/></pattern>
<filter id="card-motion-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="card-motion-soft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="card-motion-clip"><rect x="1" y="1" width="428" height="208" rx="11.5"/></clipPath>
<clipPath id="card-motion-clipo"><rect width="430" height="210" rx="12.5"/></clipPath>
</defs>
<style>
.card-motion-in{animation:card-motion-in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes card-motion-in{from{opacity:0;transform:translateY(5px)}}
.card-motion-ti{animation:card-motion-ti .55s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes card-motion-ti{from{opacity:0;transform:translateX(-8px)}}
.card-motion-br{stroke-dasharray:30;animation:card-motion-br .7s ease-out both}
@keyframes card-motion-br{from{stroke-dashoffset:30}}
.card-motion-hl{transform-origin:22px 150px;animation:card-motion-hl .7s ease-out 1.1s both}
@keyframes card-motion-hl{from{transform:scaleX(0)}}
.card-motion-gl{transform-origin:380px 171px;animation:card-motion-gl .8s cubic-bezier(.2,.8,.2,1) .9s both}
@keyframes card-motion-gl{from{opacity:0;transform:scale(.7)}}
.card-motion-fd{animation:card-motion-fd 1.2s ease-out .8s both}
@keyframes card-motion-fd{from{opacity:0}}
.card-motion-pulse{animation:card-motion-pulse 5.4s ease-in-out -3.8s infinite}
@keyframes card-motion-pulse{0%,100%{opacity:.1}50%{opacity:.36}}
.card-motion-pulse2{animation:card-motion-pulse2 5.4s ease-in-out -3.8s infinite}
@keyframes card-motion-pulse2{0%,100%{opacity:.02}50%{opacity:.08}}
.card-motion-beam{opacity:0;animation:card-motion-on 1.2s ease-out 1.8s forwards}
@keyframes card-motion-on{to{opacity:1}}
.card-motion-bm{animation:card-motion-bm 11s linear infinite}
@keyframes card-motion-bm{from{stroke-dashoffset:0}to{stroke-dashoffset:-1255.4}}
.card-motion-cur{animation:card-motion-cur 1.1s steps(1,end) infinite}
@keyframes card-motion-cur{50%{fill-opacity:0}}
.card-motion-kf{animation:card-motion-kf 3.6s cubic-bezier(.65,0,.35,1) infinite alternate}
@keyframes card-motion-kf{from{transform:translateX(-17px)}to{transform:translateX(17px)}}
.card-motion-pl{animation:card-motion-pl 1.8s ease-in-out infinite alternate}
@keyframes card-motion-pl{from{fill-opacity:.1}to{fill-opacity:.42}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
