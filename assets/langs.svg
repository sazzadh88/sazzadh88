<style>
.langs-in{animation:langs-fade .45s ease-out both}
.langs-bar{transform-box:fill-box;transform-origin:0 50%;animation:langs-grow .95s cubic-bezier(.16,1,.3,1) both}
.langs-cover{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0);animation:langs-type .85s steps(32,end) .15s both}
.langs-cur{animation:langs-blink 1.1s steps(1,end) 1s infinite}
.langs-pulse{animation:langs-pulse 3.2s ease-in-out 2.4s infinite}
.langs-sweep{animation:langs-sweep 11s linear 3.5s infinite}
.langs-shine{animation:langs-shine 6.4s cubic-bezier(.4,0,.2,1) 3.3s infinite}
@keyframes langs-fade{from{opacity:0}}
@keyframes langs-grow{from{transform:scaleX(0)}}
@keyframes langs-type{from{transform:scaleX(1)}}
@keyframes langs-blink{50%{opacity:0}}
@keyframes langs-pulse{50%{opacity:.3}}
@keyframes langs-sweep{0%{transform:translateX(0)}40%,100%{transform:translateX(1140px)}}
@keyframes langs-shine{0%{transform:translateX(0)}24%,100%{transform:translateX(600px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
